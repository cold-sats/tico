# The default lens: plain questions any team can answer. Every framework also has the vision field
# (one or two sentences, 400 characters) and the "What we won't do" section (backend/strategy.py IMPLICIT),
# so neither is listed here.
id: plain
name: Plain
choices_label: Bets
choice_label: Bet
sections:
  - key: serve
    title: Who we serve
    prompt: Who buys, who uses it, and who you turn away. Name the segment and the size of team or wallet, not "everyone".
  - key: sell
    title: What we sell
    prompt: The product or service in two or three sentences a stranger follows. What it does for the buyer, not the feature list.
  - key: win
    title: How we win
    prompt: Why a buyer picks you over the obvious alternative, including doing nothing. One or two reasons that are hard to copy.
  - key: price
    title: Pricing
    prompt: What it costs, how it is charged (per seat, per use, flat, a share) and why that model fits how the buyer sees the value.
  - key: reach
    title: Channels
    prompt: "How buyers find you and how you reach them: the two or three channels that bring most of them, and the one you are betting on next."
  - key: brand
    title: Brand and voice
    prompt: What the team should sound like and stand for in every message, and the words it never uses.
interview:
  - Who is the one kind of customer you would choose if you could only have one, and what are they trying to get done?
  - When one of them picks you, what did they almost pick instead, and why did they not?
  - What do you charge, and what would break if you charged double or half?
  - Where did your last ten customers come from, and which of those channels would you double down on?
  - Name one thing a competitor does well that you have decided not to do.
  - What request from a good customer have you turned down in the last year, and why?
  - If the team had to describe itself in one sentence to a stranger at a conference, what is the sentence?
  - What is the bet you are making that most people in your market would call wrong?
