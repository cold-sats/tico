# Rumelt's kernel (Good Strategy / Bad Strategy): a diagnosis, a guiding policy, coherent actions. The policy is
# the choices list; the three sections hold the reasoning around it.
id: rumelt
name: Rumelt's kernel
choices_label: Guiding policy
choice_label: Guiding policy
sections:
  - key: diagnosis
    title: Diagnosis
    prompt: The one or two obstacles that matter most right now, named plainly. What is the crux that, if solved, makes the rest easier? Not a list of everything that is hard.
  - key: policy
    title: Guiding policy
    prompt: The overall approach to the diagnosis, in a paragraph. Which advantage you lean on and which fights you avoid. The individual choices are listed under the policy label; this is the thread through them.
  - key: actions
    title: Coherent actions
    prompt: The handful of actions that follow from the policy and reinforce each other. Each one should be something a team can start on Monday; a goal that cannot be acted on is not an action.
interview:
  - What is the single biggest obstacle between the team and where it wants to be in two years?
  - If that obstacle were gone tomorrow, what would become easy that is hard today?
  - What advantage do you have that the obstacle does not neutralise? A relationship, a cost position, a piece of knowledge, a position in a channel?
  - What is the team doing today that does not follow from any guiding policy, and only happens because it always has?
  - Name two actions you are taking that pull in different directions.
  - What would you stop doing this quarter if you took the diagnosis seriously?
  - Which of your actions would a competitor find it hardest to copy, and why?
