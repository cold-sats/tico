# Explicit opt-in overlay: docker compose -f compose.yaml -f compose.screen-relay.yaml up -d --build
# Use the existing project for a chosen installation only. Validation uses a new unique project.
services:
  server:
    environment:
      TICO_SCREEN_RELAY: rust
      TICO_SCREEN_RELAY_URL: http://screen-relay:8766
      TICO_SCREEN_RELAY_KEY: ${TICO_SCREEN_RELAY_KEY:?set a separate relay control secret}
      TICO_TUNNEL_ORIGIN: http://screen-proxy:8080
    ports: !reset []
    depends_on:
      screen-relay: {condition: service_healthy}
  screen-relay:
    image: ${TICO_SCREEN_RELAY_IMAGE:-tico-screen-relay:pilot}
    build: {context: ., dockerfile: relay-rs/Dockerfile}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TICO_SCREEN_RELAY_KEY: ${TICO_SCREEN_RELAY_KEY:?set a separate relay control secret}
      TICO_SCREEN_PYTHON_URL: http://server:8765
  screen-proxy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["./relay-rs/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["127.0.0.1:${TICO_PORT:-8765}:8080"]
    depends_on:
      server: {condition: service_healthy}
  caddy:
    command: caddy reverse-proxy --from ${TICO_DOMAIN:-} --to screen-proxy:8080
    depends_on:
      screen-proxy: {condition: service_started}
