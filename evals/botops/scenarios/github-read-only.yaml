id: github-read-only
title: Make a bot read-only on GitHub
as: owner
live_only: true          # the change is a file in the bot's repository, which only a real turn writes
seed:
  - bot: {slug: dev-helper, name: Dev Helper, status: active}
prompt: "Dev Helper should only ever read our GitHub, never push or comment. Please make that so."
person: []
done:
  - reply_matches: "read"
  - reply_not_matches: "settings"
limits: {person_steps: 0, jargon: 0, duplicates: 0, sent_elsewhere: 0}
