#cloud-config
# Tico server on any Ubuntu 24.04 cloud VM (Hetzner, DigitalOcean, ...): writes /opt/tico/.env from the block below,
# opens 80/443, then runs the release's install.sh (the same one-line installer people run by hand), which installs
# Docker, fetches the compose bundle for the pinned release and starts the stack. Docs: docs/install.md
#
# Edit only the values between the two marker lines. Everything else is the same for every install.
# The block is stored in the provider's user-data, so it holds your sign-in secret as long as the server exists:
# prefer a client secret you can rotate, and see infra/cloud-init/README.md.
write_files:
  - path: /etc/tico/tico.env
    permissions: "0600"
    owner: root:root
    content: |
      # --- inputs begin ---
      TICO_CLOUD_VERSION=v0.0.0
      TICO_CLOUD_SERVER_IP=
      TICO_CLOUD_ALLOW_SSH=1
      TICO_COMPANY_NAME=Acme
      TICO_OWNER_EMAIL=you@example.com
      COMPOSE_PROFILES=caddy,updater
      TICO_DOMAIN=tico.example.com
      TICO_AUTH_PROXY=oidc
      TICO_OIDC_ISSUER=https://accounts.google.com
      TICO_OIDC_CLIENT_ID=
      TICO_OIDC_CLIENT_SECRET=
      TICO_UPDATER_URL=http://updater:8080
      # --- inputs end ---

  # Containers (the server, and bots on a runner) must not read the provider's metadata service: it serves this file.
  - path: /etc/systemd/system/tico-block-metadata.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Keep containers away from the cloud metadata service
      After=docker.service
      Requires=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/sh -c 'iptables -C DOCKER-USER -d 169.254.169.254 -j DROP 2>/dev/null || iptables -I DOCKER-USER -d 169.254.169.254 -j DROP'
      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/tico-bootstrap
    permissions: "0700"
    content: |
      #!/bin/bash
      # Safe to run again: it only fills in what is missing and never overwrites /opt/tico/.env.
      set -euo pipefail
      umask 077
      exec >>/var/log/tico-setup.log 2>&1
      IN=/etc/tico/tico.env
      D=/opt/tico
      say() { echo "tico-setup: $* ($(date -u +%FT%TZ))"; }
      val() { grep -m1 "^$1=" "$IN" | cut -d= -f2- || true; }

      say start
      if [ ! -f "$IN" ] && [ ! -f "$D/.env" ]; then say "no inputs found"; exit 1; fi
      if [ -f "$IN" ]; then
        version=$(val TICO_CLOUD_VERSION)
        domain=$(val TICO_DOMAIN)
        profiles=$(val COMPOSE_PROFILES)
        server_ip=$(val TICO_CLOUD_SERVER_IP)
        allow_ssh=$(val TICO_CLOUD_ALLOW_SSH)
        # Values reach shell commands and URLs below, so accept only what they can legitimately be.
        [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ && "$version" != v0.0.0 ]] || { say "TICO_CLOUD_VERSION must be a release such as v1.2.3"; exit 1; }
        [[ "$domain" =~ ^[A-Za-z0-9.-]+$ ]] || { say "TICO_DOMAIN is not a host name"; exit 1; }
        [[ "$server_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ || -z "$server_ip" ]] || { say "TICO_CLOUD_SERVER_IP is not an IPv4 address"; exit 1; }
      else
        domain=$(grep -m1 '^TICO_DOMAIN=' "$D/.env" | cut -d= -f2-)
        profiles=$(grep -m1 '^COMPOSE_PROFILES=' "$D/.env" | cut -d= -f2-)
        version=$(cat "$D/.bundle-version" 2>/dev/null || true); server_ip=""; allow_ssh=""
        [ -n "$version" ] || { say "no inputs and no installed release found"; exit 1; }
      fi

      # Firewall. Docker publishes 80/443 itself, so the provider's firewall is the real gate; this closes everything else.
      if ! command -v ufw >/dev/null; then apt-get update -qq && apt-get install -y -qq ufw; fi
      ufw default deny incoming >/dev/null
      ufw default allow outgoing >/dev/null
      if [ "$allow_ssh" = 1 ]; then ufw limit 22/tcp >/dev/null; fi
      case ",$profiles," in
        *,caddy,*) ufw allow 80/tcp >/dev/null; ufw allow 443/tcp >/dev/null; ufw allow 443/udp >/dev/null ;;
      esac
      ufw --force enable >/dev/null
      say firewall ready

      mkdir -p "$D"
      if [ ! -f "$D/.env" ]; then
        [ -f "$IN" ] || { say "cannot write .env without inputs"; exit 1; }
        { grep -v -e '^TICO_CLOUD_' -e '^#' -e '^$' "$IN" || true; echo "TICO_TAG=$version"; } > "$D/.env.new"
        chmod 600 "$D/.env.new"; mv "$D/.env.new" "$D/.env"
      fi
      say ".env in place"

      case ",$profiles," in
        *,caddy,*)
          # Caddy asks for its certificate at first start and that fails quietly if the name does not point here yet.
          say "waiting for DNS (up to 30 minutes)"
          for _ in $(seq 1 120); do
            got=$(getent ahostsv4 "$domain" | awk '{print $1}' | sort -u || true)
            if [ -n "$got" ] && { [ -z "$server_ip" ] || echo "$got" | grep -qx "$server_ip"; }; then break; fi
            sleep 15
          done ;;
      esac

      # The release's own installer (its version is baked in, so it needs no flag): an existing .env means it installs Docker, unpacks the
      # bundle and starts the stack without asking anything. Docker comes first so the metadata block can go in
      # before any container runs.
      installer=$(mktemp)
      for _ in 1 2 3; do
        curl -fsSL --retry 3 "https://github.com/ticoteam/tico/releases/download/$version/install.sh" -o "$installer" && break
        sleep 10
      done
      [ -s "$installer" ] || { say "could not download install.sh for $version"; exit 1; }
      sh "$installer" --docker-only --dir "$D"
      systemctl enable --now tico-block-metadata.service >/dev/null
      say "docker ready"
      sh "$installer" --yes --dir "$D"
      rm -f "$installer"
      say "server healthy"

      # The secrets now live only in /opt/tico/.env (0600): drop the inputs and cloud-init's copies of them.
      rm -f "$IN" /var/lib/cloud/instance/user-data.txt* /var/lib/cloud/instance/cloud-config.txt /var/lib/cloud/instance/scripts/* 2>/dev/null || true
      touch "$D/.bootstrapped"
      say finished

runcmd:
  - [/usr/local/sbin/tico-bootstrap]
