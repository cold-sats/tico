name: botops                     # the slug: it matches the repository emp-botops and the label owner:botops
display_name: "BotOps"
labels: [owner:botops]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the draft on the task and asks for an approval.
outbound_send: false

# Recurring work this bot owns. The server runs the clock and turns each occurrence into a task.
# Start with none. A routine earns its place after a person has read a week of the same work done
# by hand. See docs/routines.md for the shape.
schedules: []

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; the value lives in the workspace secrets directory on the machine
# that runs the bot. Declaring access here does not create it.
# access:
#   - service: mail
#     identity: "desk@example.com"
#     can: [read, draft]          # send only with outbound_send: true and an approval
#     env: MAIL_CREDENTIALS
#     note: "reads and drafts on its own mailbox; never files and never sends"
access: []
