name: chief-of-staff              # the slug: it matches the repository bot-chief-of-staff and the label owner:chief-of-staff
display_name: "Chief of Staff"
labels: [owner:chief-of-staff]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Internal only. Nothing addressed to anyone outside the company leaves, and this bot has no way to.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first draft on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
routines:
  - id: weekly-company-brief
    title: Weekly company brief
    cron: "0 15 * * 5"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-company-brief.md
    labels: [priority:p2]
    enabled: false

# The hub itself (goals, tasks, updates, meetings, calendar, docs) needs no entry: every turn has it.
# This bot reads nothing outside the hub, so there is nothing to declare.
tools: []
