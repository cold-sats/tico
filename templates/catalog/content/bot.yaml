name: content                     # the slug: it matches the repository bot-content and the label owner:content
display_name: "Content Marketer"
labels: [owner:content]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first plan on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
routines:
  - id: weekly-content-plan
    title: Weekly content plan
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-content-plan.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; the value lives in the workspace secrets directory on the machine
# that runs the bot. Declaring access here does not create it.
# tools:
#   - service: mail
#     identity: "desk@example.com"
#     can: [read, draft]          # send only with outbound_send: true and an approval
#     env: MAIL_CREDENTIALS
#     note: "reads and drafts on its own mailbox; never files and never sends"
tools: []
