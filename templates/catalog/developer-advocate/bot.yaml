name: developer-advocate              # the slug: it matches the repository bot-developer-advocate and the label owner:developer-advocate
display_name: "Developer Advocate"
labels: [owner:developer-advocate]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then every
# public reply is prepared on the task, and one exact-text approval authorizes that one post.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first pulse on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
routines:
  - id: weekly-developer-pulse
    title: Weekly developer pulse
    cron: "0 10 * * 4"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-developer-pulse.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. Public forums are read on the open web and need no entry.
# The SDK and examples repositories are read with the company's GitHub App token once the owner lists them.
# Optional, uncomment when connected. Neither entry may ever carry write or send; a person posts approved text.
# tools:
#   - service: github
#     identity: "the SDK, examples and discussion repositories the owner lists for this bot"
#     can: [read]
#     note: "reads discussions, issues and example code; never comments, opens a pull request or pushes"
#   - service: slack
#     identity: the company workspace
#     can: [read]
#     channels: [developer-community]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "reads one community channel; never posts"
tools: []
