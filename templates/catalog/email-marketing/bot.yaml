name: email-marketing                     # the slug: it matches the repository bot-email-marketing and the label owner:email-marketing
display_name: "Email Marketing Manager"
labels: [owner:email-marketing]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts every draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first draft on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
routines:
  - id: weekly-email-draft
    title: Weekly email campaign draft
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-email-draft.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# The hub itself (tasks, files) needs no entry: every turn has it. This bot has no access to the sending tool
# and none is offered here: a person loads and sends every email.
# Optional, uncomment when the owner wants replies to earlier campaigns readable:
# tools:
#   - service: gmail
#     identity: "marketing@example.com"
#     can: [read, draft]          # never send: outbound_send stays false
#     env: GOOGLE_SA_KEY
#     note: "reads replies to campaigns; never files or sends"
tools: []
