name: learning                     # the slug: it matches the repository emp-learning and the label owner:learning
display_name: "Learning and Development Specialist"
labels: [owner:learning]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the finished message on the task and asks for an approval.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a person starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
schedules:
  - id: weekly-training-tracker
    title: Weekly training tracker
    cron: "0 9 * * 4"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-training-tracker.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
access: []
# There is deliberately no learning-platform entry: completion records arrive as exports on tasks, and a person
# enrolls people and buys courses once a spend request is approved.
