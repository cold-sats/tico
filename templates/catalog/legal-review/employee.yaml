name: legal-review                     # the slug: it matches the repository emp-legal-review and the label owner:legal-review
display_name: "Contracts Manager"
labels: [owner:legal-review]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts every draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a human approves the first draft on the setup task.
# `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
schedules:
  - id: weekly-contract-calendar
    title: Weekly contract calendar
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-contract-calendar.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
access: []
# Optional, uncomment when connected. Contracts arrive as files attached to a task; reading the shared mailbox
# where counterparties send them saves a step. Nothing here ever reaches a counterparty.
# access:
#   - service: gmail
#     identity: "contracts@example.com"
#     can: [read, draft]          # never send: outbound_send stays false
#     env: GOOGLE_SA_KEY
#     note: "reads contract threads and leaves an internal draft; never replies to a counterparty"
