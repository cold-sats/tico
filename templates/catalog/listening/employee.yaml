name: listening                     # the slug: it matches the repository emp-listening and the label owner:listening
display_name: "Social Media Manager"
labels: [owner:listening]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: low
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a person starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
# One sweep to start with. A second earns its place once someone has read a week of the first.
schedules:
  - id: weekday-morning-sweep
    title: Weekday morning sweep
    cron: "0 8 * * 1-5"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekday-sweep.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; the value lives in the workspace secrets directory on the machine
# that runs the bot. Declaring access here does not create it. A browser access also names
# `sites:`, so the connector can refuse every other host.
# access:
#   - service: browser
#     identity: "the company browser profile"
#     can: [read]
#     sites: ["news.example.com"]
#     note: "reads public search results; never clicks, types or submits"
access: []
