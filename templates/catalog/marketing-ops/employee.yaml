name: marketing-ops                     # the slug: it matches the repository emp-marketing-ops and the label owner:marketing-ops
display_name: "Marketing Operations Manager"
labels: [owner:marketing-ops]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts every prepared item on the task and asks for an approval.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a person starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
schedules:
  - id: weekly-marketing-data-check
    title: Weekly marketing data check
    cron: "0 10 * * 1"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-marketing-data-check.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Optional, uncomment when connected. Read only: the bot lists each fix and a person makes it, or the
# owner turns writing on later. It never edits a field, a scoring rule or a workflow.
# access:
#   - service: crm
#     identity: "the company's CRM account"
#     can: [read]
#     env: CRM_API_KEY
#     note: "leads, lifecycle stages, original source and owner; read only"
access: []
