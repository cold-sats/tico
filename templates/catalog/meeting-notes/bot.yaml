name: meeting-notes               # the slug: it matches the repository bot-meeting-notes and the label owner:meeting-notes
display_name: "Project Coordinator"
labels: [owner:meeting-notes]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts every draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). It runs on the hub's
# `meeting.ready` event: one task per imported company meeting, carrying the notes and transcript.
# The bot arms it with `hub routine update <id> --enable` after a person approves the first draft.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
routines:
  - id: meeting-notes
    title: Meeting notes draft
    "on": meeting.ready               # quoted: an unquoted `on` is read as a boolean by YAML
    template: playbooks/write-up-a-meeting.md
    labels: [priority:p3]
    enabled: false

# The hub itself (meetings, tasks, goals, docs) needs no entry: every turn has it. Bots read company
# meetings and never private ones. Add a Slack entry only when a person wants approved summaries
# posted to an internal channel; posting is still gated by an approval.
# tools:
#   - service: slack
#     identity: the company workspace
#     can: [read, post]
#     channels: [team]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "posts an approved summary to one internal channel; never a DM, never a customer channel"
tools: []
