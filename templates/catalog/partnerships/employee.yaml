name: partnerships                # the slug: it matches the repository emp-partnerships and the label owner:partnerships
display_name: "Partnerships Manager"
labels: [owner:partnerships]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts every partner message on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first review on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
schedules:
  - id: weekly-partner-review
    title: Weekly partner pipeline review
    cron: "0 9 * * 4"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-partner-review.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
access:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "candidate partners' public sites and directories; no forms, no messages, no accounts"
# Optional, uncomment when connected. Neither entry may ever carry write or send.
#   - service: close-crm
#     identity: "the company's CRM account"
#     can: [read]
#     env: CLOSE_API_KEY
#     note: "pipeline and lead sources for conflict checks; read only"
#   - service: gmail
