name: reputation
display_name: "Reputation Manager"
labels: [owner:reputation]
reads: []                           # other bot repositories this one may clone read-only
slack_channel: "#marketing"

# These must agree with the bot's settings on the server, or be left out of this file entirely.
# Public text is written at high effort: every reply this bot drafts is read by a stranger.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts the draft on the task and asks for an approval. Review invitations stay off even
# then: they are sent from the product's own email, or by a human, never by this bot.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
# One sweep to start with. A midweek pass earns its place once someone has read a month of these.
routines:
  - id: weekly-review-sweep
    title: Weekly review sweep
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-review-sweep.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; the value lives in the workspace secrets directory on the computer
# that runs the bot. Declaring access here does not create it. A browser access also names
# `sites:`, so the tool can refuse every other host.
tools:
  - service: aside
    identity: "the team browser (Aside)"
    can: [read]
    sites: [yelp.com, bbb.org, google.com, trustpilot.com, capterra.com, g2.com, getapp.com,
            softwareadvice.com, glassdoor.com, indeed.com, apps.apple.com, play.google.com, sitejabber.com]
    note: "reads every listing; on a sign in wall or a challenge, record the surface as blocked. Until the owner turns execution on, a human carries out each approved batch"
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "review pages and the platforms' own policy pages; no forms, messages, or account creation"
  - service: slack
    identity: "the team workspace"
    can: [read]
    channels: [marketing]
    env: SLACK_BOT_TOKEN
    note: "reads the internal marketing channel; posting is off"
# Owner's decision, after a human has approved the first batch and chosen to let the bot execute approved
# batches item by item: change the Aside entry to `can: [read, act]` (act only to carry out a batch a publish
# approval lists item by item: report/flag, owner reply, BBB answer, claim, category; never anything outside
# that payload). To let it post the weekly digest to the marketing channel, change the Slack entry to
# `can: [read, post]` (internal channels only).
