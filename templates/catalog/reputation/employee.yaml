name: reputation
display_name: "Reputation"
labels: [owner:reputation]
reads: []                           # other bot repositories this one may clone read-only
slack_channel: "#marketing"

# These must agree with the bot's settings on the server, or be left out of this file entirely.
# Public text is written at high effort: every reply this bot drafts is read by a stranger.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the draft on the task and asks for an approval. Review invitations stay off even
# then: they are sent from the product's own email, or by a person, never by this bot.
outbound_send: false

# The routines this bot starts with; `hub bot create` seeds them into the hub, and from then on
# the hub's rows are the routines (docs/routines.md).
# One sweep to start with. A midweek pass earns its place once someone has read a month of these.
schedules:
  - id: weekly-review-sweep
    title: Weekly review sweep
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-review-sweep.md
    labels: [priority:p2]

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; the value lives in the workspace secrets directory on the machine
# that runs the bot. Declaring access here does not create it. A browser access also names
# `sites:`, so the connector can refuse every other host.
access:
  - service: aside
    identity: "the company browser (Aside)"
    can: [read, act]
    sites: [yelp.com, bbb.org, google.com, trustpilot.com, capterra.com, g2.com, getapp.com,
            softwareadvice.com, glassdoor.com, indeed.com, apps.apple.com, play.google.com, sitejabber.com]
    note: "reads every listing; acts only to execute a batch a publish approval lists item by item (report/flag, owner reply, BBB answer, claim, category); never submits anything outside that payload; on a sign in wall or a challenge, record the surface as blocked"
  - service: web-search
    can: [use]
    note: "finding review pages and listings under the company's name and its old names"
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "review pages and the platforms' own policy pages; no forms, messages, or account creation"
  - service: slack
    identity: "the company workspace"
    can: [read, post]
    channels: [marketing]
    env: SLACK_BOT_TOKEN
    note: "internal channels only: the weekly digest and a new-negative-review alert"
