name: returns                         # the slug: it matches the repository emp-returns and the label owner:returns
display_name: "Returns and Refunds Specialist"
labels: [owner:returns]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts every prepared reply on the task and asks for an approval; refunds are always a person's act.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first report on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
schedules:
  - id: weekly-returns-report
    title: Weekly returns report
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-returns-report.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Optional, uncomment what the onboarding says is connected. No entry may ever carry write or send.
# access:
#   - service: gmail
#     identity: "support@example.com"
#     can: [read]
#     env: GOOGLE_SA_KEY
#     note: "reads return requests and their photos; never drafts, files or sends"
#   - service: shopify
#     identity: "the shop admin, a read-only custom app"
#     can: [read]
#     env: SHOPIFY_ADMIN_TOKEN
#     note: "orders, fulfilments and returns; read_orders scope only, never a refund"
access: []
