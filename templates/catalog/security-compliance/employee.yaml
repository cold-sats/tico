name: security-compliance                     # the slug: it matches the repository emp-security-compliance and the label owner:security-compliance
display_name: "Security and Compliance Analyst"
labels: [owner:security-compliance]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts what it prepared on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a human approves the first result on the setup task.
# `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
schedules:
  - id: monthly-controls-page
    title: Monthly evidence and controls page
    cron: "0 10 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-controls-page.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
access: []
# Optional, uncomment when connected. Repository settings are evidence for change-review controls:
# access:
#   - service: github
#     identity: "the product repositories the owner lists for this bot"
#     can: [read]
#     note: "reads branch protection and review settings; never changes them"
