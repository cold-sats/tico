name: sourcer                     # the slug: it matches the repository bot-sourcer and the label owner:sourcer
display_name: "Sourcer"
labels: [owner:sourcer]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the finished message on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first result on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
routines:
  - id: weekly-sourcing-slate
    title: Weekly sourcing slate
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-sourcing-slate.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools: []
# Optional, uncomment when connected. A recruiting mailbox lets outreach and replies live in real threads.
# tools:
#   - service: gmail
#     identity: "talent@example.com"
#     can: [read, draft]          # never send: outbound_send stays false; each message goes on an approval
#     env: GOOGLE_SA_KEY
#     note: "reads replies to outreach and leaves each message as a draft; never sends, files or deletes"
