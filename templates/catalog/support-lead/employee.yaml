name: support-lead                     # the slug: it matches the repository emp-support-lead and the label owner:support-lead
display_name: "Head of Customer Support"
labels: [owner:support-lead]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts every draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a person starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
schedules:
  - id: weekly-support-summary
    title: Weekly support summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/weekly-support-summary.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# The hub itself (tasks, updates, reports, the org) needs no entry: every turn has it. Optional, uncomment
# what the onboarding says is connected. Neither entry may ever carry write or send.
# access:
#   - service: gmail
#     identity: "support@example.com"
#     can: [read]
#     env: GOOGLE_SA_KEY
#     note: "reads the support mailbox to count arrivals and first replies; never drafts, files or sends"
#   - service: slack
#     identity: the company workspace
#     can: [read]
#     channels: [support]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "reads one support channel for questions that never became tickets; never posts"
access: []
