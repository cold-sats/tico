name: support-ops                     # the slug: it matches the repository emp-support-ops and the label owner:support-ops
display_name: "Support Operations Specialist"
labels: [owner:support-ops]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. This bot
# contacts no one outside; every change it proposes is applied by a person.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a person starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
# Cron runs Mondays 1-7 of the month; the playbook skips a run that is not the month's first Monday.
schedules:
  - id: monthly-helpdesk-audit
    title: Monthly help desk audit
    cron: "0 9 1-7 * 1"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/monthly-helpdesk-audit.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Optional, uncomment when connected. No entry may ever carry write, modify or delete: a person applies changes.
# access:
#   - service: zendesk
#     identity: "a read-only admin or an API token scoped to read"
#     can: [read]
#     env: ZENDESK_API_TOKEN
#     note: "reads triggers, automations, SLA policies, macros, tags and a ticket sample; never a change"
access: []
