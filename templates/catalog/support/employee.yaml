name: support                     # the slug: it matches the repository emp-support and the label owner:support
display_name: "Support Agent"
labels: [owner:support]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Until then
# the bot puts the draft on the task and asks for an approval.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). The bot arms it with
# `hub routine update <id> --enable` after a person approves the first digest on the onboarding task.
# `hub bot create` seeds it once; from then on the hub's row is the routine (docs/routines.md).
schedules:
  - id: daily-support-queue
    title: Daily support queue
    cron: "0 9 * * 1-5"
    timezone: America/Los_Angeles     # set this to the company's own timezone
    template: playbooks/daily-support-queue.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. The intake is tasks in the
# hub until an owner connects a source: changing access is an owner decision, so the bot files a task
# for the owner rather than editing this file. Uncomment what the onboarding says is connected.
# A support mailbox is read with the Google Workspace key. On a computer shared with other bots that
# key is closed to them (docs/mail.md, "Who can read the key"), so route support mail to this bot as
# tasks from the owner's Inbox Manager bot instead.
# access:
#   - service: gmail
#     identity: "support@example.com"
#     can: [read, draft]          # never send: outbound_send stays false
#     env: GOOGLE_SA_KEY
#     note: "reads and drafts on the support mailbox; never files, archives or sends"
#   - service: slack
#     identity: the company workspace
#     can: [read]
#     channels: [support]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "reads one support channel; never posts"
access: []
