name: CHANGE-ME              # slug, matches bot-<name> and owner:<name>
display_name: "Change Me"
labels: [owner:CHANGE-ME]
reads: []                    # other bot-* repos to clone read-only
slack_channel: "#agents"
# Runtime and model come from the company's provider choice (Settings > AI providers).
# Override here only if this employee needs something different:
# runtime: <runtime>
# model: <model id>
# reasoning_effort: high
# max_run_minutes: 90
# Outbound sends (email, DMs, posts, calendar invites to anyone outside the company) are off
# until an owner sets this true. Drafts go on the task instead.
outbound_send: false
# Routines are rows in the hub, not lines here: `hub routine set <key> --title ... --cron ...`
# from a turn, or Tasks -> Recurring on the site (docs/routines.md).
# What this employee may touch. Shown in the hub app. Not listed = not allowed. See hub policies/access.md.
# tools:
#   - service: gmail
#     identity: "owner@example.com"
#     can: [read, draft]          # send only with outbound_send: true
#     env: GMAIL_CREDENTIALS      # secret in <workspace>/secrets/<slug>.env
# Files: what the runner lists on this bot's page after a completed turn (docs/files.md). Default is
# reports/ and artifacts/; `publish: []` turns it off.
# files:
#   publish: [reports/, artifacts/]
tools: []
