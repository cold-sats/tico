# Who may sign in to this team's server. `clients/environments.py` copies it in, filling in the
# owner given at creation. It only seeds the first boot: after that the owner, the allow list and
# the bot administrators are edited in Settings > Humans (docs/people.md), and this file is not read.
#
# The owner sees everything. Who else may see, read and write to each bot is set per bot in
# Settings > Bots (docs/permissions.md), not here. A hosted server must also let these humans
# through its identity proxy: this file and that policy have to agree.

owner: {{owner_email}}

# Anyone with an email at these domains may sign in. Empty means individual addresses only.
allowed_domains: []

allowed:
  - {{owner_email}}

# Bot administrators may create bots and manage settings for bots assigned to their own
# owner identity. Not team-owner visibility.
bot_admins: []
